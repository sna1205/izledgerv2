services:
  - type: web
    name: izledger-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

services:
  - type: web
    name: izledger-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: STORAGE_ENABLED
        value: false
      - key: LOG_LEVEL
        value: info

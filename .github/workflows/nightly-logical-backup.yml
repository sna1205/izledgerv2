name: Nightly Logical Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  nightly-logical-backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      BACKUP_S3_FORCE_PATH_STYLE: ${{ secrets.BACKUP_S3_FORCE_PATH_STYLE }}
      BACKUP_OBJECT_PREFIX: ${{ secrets.BACKUP_OBJECT_PREFIX }}
      BACKUP_LAST_RESTORE_VERIFIED_AT: ${{ secrets.BACKUP_LAST_RESTORE_VERIFIED_AT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate backup readiness
        run: npm run backup:check -- --require-restore-drill=true --skip-storage-check=true

      - name: Run logical backup
        run: npm run backup:logical

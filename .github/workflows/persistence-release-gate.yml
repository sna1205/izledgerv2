name: Persistence Release Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  persistence-release-gate:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/izledger_test
      PRISMA_MIGRATE_CHECK_SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/izledger_shadow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prepare integration PostgreSQL
        run: npm --workspace @izledger/api run test:db:prepare

      - name: Create Prisma shadow database
        run: docker compose -f apps/api/docker-compose.test.yml exec -T postgres createdb -U postgres izledger_shadow

      - name: Check Prisma release state
        run: npm run prisma:check:release

      - name: Run persistence-critical release gate
        run: npm run check:persistence:release

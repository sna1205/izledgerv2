<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/izledger-favicon.svg" />
    <title>IZLedger</title>
    <meta name="description" content="IZLedger trading journal" />
    <meta name="author" content="IZLedger" />

    <meta property="og:title" content="IZLedger" />
    <meta property="og:description" content="IZLedger trading journal" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IZLedger" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IZLedger" />
    <meta name="twitter:description" content="IZLedger trading journal" />
    <script>
      (function () {
        var storageKey = "izledger-theme";
        var className = "dark";
        var root = document.documentElement;
        var storedTheme = localStorage.getItem(storageKey);
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = storedTheme === "light" || storedTheme === "dark" || storedTheme === "system" ? storedTheme : "system";

        if (theme === "dark" || (theme === "system" && prefersDark)) {
          root.classList.add(className);
          root.style.colorScheme = "dark";
        } else {
          root.classList.remove(className);
          root.style.colorScheme = "light";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
